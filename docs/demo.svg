<path d="M258.7 286 Q204.6 280.6 195.4 249" class="d5 e" marker-end="url(#ah)"/>
<path d="M195.4 176 Q204.6 144.4 258.7 139" class="d5 e" marker-end="url(#ah)"/>
<rect x="216.1" y="72" width="210" height="61" rx="12" class="d1 card c-info" filter="url(#sh)"/>
<rect x="404.2" y="182" width="210" height="61" rx="12" class="d2 card c-ok" filter="url(#sh)"/>
<rect x="216.1" y="292" width="210" height="61" rx="12" class="d3 card c-ok" filter="url(#sh)"/>
<rect x="28" y="182" width="210" height="61" rx="12" class="d4 card c-warn" filter="url(#sh)"/>
<text x="321.1" y="234.5" class="d5 big" text-anchor="middle">↻</text>
<text x="321.1" y="97" class="d1 t" text-anchor="middle">Full lookup</text>
<text x="321.1" y="118" class="d1 n" text-anchor="middle">walks the tree (slow)</text>
<text x="509.2" y="207" class="d2 t" text-anchor="middle">Answer cached</text>
<text x="509.2" y="228" class="d2 n" text-anchor="middle">kept for TTL seconds</text>
<text x="321.1" y="317" class="d3 t" text-anchor="middle">Instant answers</text>
<text x="321.1" y="338" class="d3 n" text-anchor="middle">everyone near reuses it</text>
<text x="133" y="207" class="d4 t" text-anchor="middle">TTL expires</text>
<text x="133" y="228" class="d4 n" text-anchor="middle">the answer is thrown away</text>
</g>
</svg>
