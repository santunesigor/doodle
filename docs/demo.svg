<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" role="img" aria-label="Doodle demo: a request becomes a five-line spec and then a diagram">
<title>Doodle demo</title>
<desc>Someone asks an agent to explain DNS caching with drawings. Doodle writes a five-line text spec and renders it into a diagram of the DNS cache cycle: full lookup, answer cached, instant answers, TTL expires.</desc>
<style>svg{--bg:#fffdf9;--line:#ebe5da;--ink:#1f2933;--mut:#5f6b7a;--edge:#7b8794;--on:#ffffff;--neutral1:#f4f1ea;--neutral2:#8a8174;--info1:#e8f1fc;--info2:#3a78c2;--ok1:#e7f6eb;--ok2:#2f8a4b;--bad1:#fdecea;--bad2:#c8423b;--warn1:#fff5df;--warn2:#c38410}@media (prefers-color-scheme:dark){svg{--bg:#14181d;--line:#2a3038;--ink:#e6e9ed;--mut:#a2acb8;--edge:#8d98a5;--on:#14181d;--neutral1:#23272e;--neutral2:#8b949e;--info1:#132a43;--info2:#6aa8ec;--ok1:#12301d;--ok2:#5cc184;--bad1:#3b1716;--bad2:#f07c74;--warn1:#3a2c0c;--warn2:#f0b543}}text{font-family:ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg);stroke:var(--line)}.grid{fill:url(#grid)}.h{font-size:20px;font-weight:700}.sub{font-size:13px;fill:var(--mut)}.t{font-size:15px;font-weight:650}.n{font-size:13px;fill:var(--mut)}.card{stroke-width:1.6}.w{fill:var(--on);font-size:12px;font-weight:700}.sk{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.sk2{stroke-width:.9;opacity:.6}.e{fill:none;stroke:var(--edge);stroke-width:1.8;stroke-linecap:round}.d{stroke-dasharray:6 5}.ah{fill:var(--edge)}.ln{stroke:var(--line);stroke-width:2;fill:none}.el{font-size:12.5px;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.big{font-size:64px;fill:var(--line)}.c-neutral{fill:var(--neutral1);stroke:var(--neutral2)}.f-neutral{fill:var(--neutral2)}.k-neutral{fill:var(--neutral1)}.s-neutral{stroke:var(--neutral2)}.x-neutral{fill:var(--neutral2)}.c-info{fill:var(--info1);stroke:var(--info2)}.f-info{fill:var(--info2)}.k-info{fill:var(--info1)}.s-info{stroke:var(--info2)}.x-info{fill:var(--info2)}.c-ok{fill:var(--ok1);stroke:var(--ok2)}.f-ok{fill:var(--ok2)}.k-ok{fill:var(--ok1)}.s-ok{stroke:var(--ok2)}.x-ok{fill:var(--ok2)}.c-bad{fill:var(--bad1);stroke:var(--bad2)}.f-bad{fill:var(--bad2)}.k-bad{fill:var(--bad1)}.s-bad{stroke:var(--bad2)}.x-bad{fill:var(--bad2)}.c-warn{fill:var(--warn1);stroke:var(--warn2)}.f-warn{fill:var(--warn2)}.k-warn{fill:var(--warn1)}.s-warn{stroke:var(--warn2)}.x-warn{fill:var(--warn2)}svg{--tbg:#fbf8f2;--tframe:#e6dfd2;--tpanel:#fffdf9;--tink:#1f2933;--tmut:#6b7685;--tacc:#d9622b;--tok:#2f8a4b}@media (prefers-color-scheme:dark){svg{--tbg:#0f1216;--tframe:#2a3038;--tpanel:#14181d;--tink:#e6e9ed;--tmut:#97a1ad;--tacc:#f08a52;--tok:#5cc184}}.frame{fill:var(--tbg);stroke:var(--tframe);stroke-width:1.5}.panel{fill:var(--tpanel);stroke:var(--tframe);stroke-width:1.2}.term text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.term .tx{font-size:14px}.term .sp{font-size:12.5px}.term .b{font-weight:700}.term .ink{fill:var(--tink)}.term .mut{fill:var(--tmut)}.term .acc{fill:var(--tacc)}.term .ok{fill:var(--tok)}.dot{fill:var(--tframe)}.ph rect{fill:none;stroke:var(--tframe);stroke-width:1.5;stroke-dasharray:7 6}.ph text{font-size:14px;fill:var(--tmut)}@keyframes kd0{0%,47.14%{opacity:0}49.64%,95.00%{opacity:1}98.57%,100%{opacity:0}}.d0{opacity:0;animation:kd0 14.0s linear infinite}@keyframes kd5{0%,61.43%{opacity:0}63.93%,95.00%{opacity:1}98.57%,100%{opacity:0}}.d5{opacity:0;animation:kd5 14.0s linear infinite}@keyframes kd1{0%,50.00%{opacity:0}52.50%,95.00%{opacity:1}98.57%,100%{opacity:0}}.d1{opacity:0;animation:kd1 14.0s linear infinite}@keyframes kd2{0%,52.86%{opacity:0}55.36%,95.00%{opacity:1}98.57%,100%{opacity:0}}.d2{opacity:0;animation:kd2 14.0s linear infinite}@keyframes kd3{0%,55.71%{opacity:0}58.21%,95.00%{opacity:1}98.57%,100%{opacity:0}}.d3{opacity:0;animation:kd3 14.0s linear infinite}@keyframes kd4{0%,58.57%{opacity:0}61.07%,95.00%{opacity:1}98.57%,100%{opacity:0}}.d4{opacity:0;animation:kd4 14.0s linear infinite}@keyframes kl0{0%,23.04%{opacity:0}25.54%,95.00%{opacity:1}98.57%,100%{opacity:0}}.l0{opacity:0;animation:kl0 14.0s linear infinite}@keyframes ks0{0%,25.89%{opacity:0}28.39%,95.00%{opacity:1}98.57%,100%{opacity:0}}.s0{opacity:0;animation:ks0 14.0s linear infinite}@keyframes ks1{0%,27.46%{opacity:0}29.96%,95.00%{opacity:1}98.57%,100%{opacity:0}}.s1{opacity:0;animation:ks1 14.0s linear infinite}@keyframes ks2{0%,29.04%{opacity:0}31.54%,95.00%{opacity:1}98.57%,100%{opacity:0}}.s2{opacity:0;animation:ks2 14.0s linear infinite}@keyframes ks3{0%,30.61%{opacity:0}33.11%,95.00%{opacity:1}98.57%,100%{opacity:0}}.s3{opacity:0;animation:ks3 14.0s linear infinite}@keyframes ks4{0%,32.18%{opacity:0}34.68%,95.00%{opacity:1}98.57%,100%{opacity:0}}.s4{opacity:0;animation:ks4 14.0s linear infinite}@keyframes ks5{0%,33.75%{opacity:0}36.25%,95.00%{opacity:1}98.57%,100%{opacity:0}}.s5{opacity:0;animation:ks5 14.0s linear infinite}@keyframes ks6{0%,35.32%{opacity:0}37.82%,95.00%{opacity:1}98.57%,100%{opacity:0}}.s6{opacity:0;animation:ks6 14.0s linear infinite}@keyframes kl1{0%,39.04%{opacity:0}41.54%,95.00%{opacity:1}98.57%,100%{opacity:0}}.l1{opacity:0;animation:kl1 14.0s linear infinite}@keyframes kl2{0%,42.61%{opacity:0}45.11%,95.00%{opacity:1}98.57%,100%{opacity:0}}.l2{opacity:0;animation:kl2 14.0s linear infinite}@keyframes kph{0%,47.14%{opacity:1}49.29%,97.86%{opacity:0}99.29%,100%{opacity:1}}.ph{animation:kph 14.0s linear infinite}@keyframes kcur{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:kcur 1s step-end infinite}@media (prefers-reduced-motion:reduce){.d0,.d5,.d1,.d2,.d3,.d4,.l0,.s0,.s1,.s2,.s3,.s4,.s5,.s6,.l1,.l2{animation:none;opacity:1}.ph{animation:none;opacity:0}.cur{animation:none}[clip-path]{clip-path:none}}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity=".10"/></filter><clipPath id="typing"><rect x="66" y="70" height="30" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;2.0;10.4;18.9;27.3;35.8;44.2;52.7;61.1;69.6;78.0;86.5;94.9;103.4;111.8;120.3;128.8;137.2;145.6;154.1;162.5;171.0;179.4;187.9;196.3;204.8;213.2;221.7;230.1;238.6;247.0;255.5;263.9;272.4;280.8;289.3;0;0" keyTimes="0;0.0429;0.0473;0.0518;0.0563;0.0607;0.0652;0.0696;0.0741;0.0786;0.0830;0.0875;0.0920;0.0964;0.1009;0.1054;0.1098;0.1143;0.1188;0.1232;0.1277;0.1321;0.1366;0.1411;0.1455;0.1500;0.1545;0.1589;0.1634;0.1679;0.1723;0.1768;0.1812;0.1857;0.1902;0.1946;0.9857;1"/></rect></clipPath></defs>
<rect x="1" y="1" width="1118" height="438" rx="20" class="frame"/>
<g class="term">
<rect x="24" y="24" width="420" height="392" rx="14" class="panel"/>
<circle cx="46" cy="46" r="5" class="dot"/><circle cx="64" cy="46" r="5" class="dot"/><circle cx="82" cy="46" r="5" class="dot"/>
<text x="48" y="92" class="tx acc">&gt;</text>
<text x="66" y="92" class="tx ink" clip-path="url(#typing)">explain DNS caching, with drawings</text>
<text x="48" y="132" class="tx l0"><tspan class="acc">●</tspan> <tspan class="ink b">doodle</tspan><tspan class="mut">  writing a tiny spec…</tspan></text>
<text x="64" y="162" class="sp mut s0">```doodle</text>
<text x="64" y="183" class="sp ink s1">cycle: The cache cycle</text>
<text x="64" y="204" class="sp ink s2">Full lookup | walks the tree (slow) | info</text>
<text x="64" y="225" class="sp ink s3">Answer cached | kept for TTL seconds | ok</text>
<text x="64" y="246" class="sp ink s4">Instant answers | everyone near reuses it | ok</text>
<text x="64" y="267" class="sp ink s5">TTL expires | the answer is thrown away | warn</text>
<text x="64" y="288" class="sp mut s6">```</text>
<text x="48" y="327" class="tx l1"><tspan class="acc">●</tspan> <tspan class="ink b">render</tspan><tspan class="mut">  5 lines of spec → 1 SVG</tspan></text>
<text x="48" y="355" class="tx l2"><tspan class="ok">✓</tspan> <tspan class="ink">img/the-cache-cycle.svg</tspan></text>
<rect x="356.3" y="78" width="8" height="18" class="cur" style="fill:var(--tacc)" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.1946;0.2589;1"/></rect>
</g>
