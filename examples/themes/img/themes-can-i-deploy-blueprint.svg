:var(--warn2)}.f-warn{fill:var(--warn2)}.k-warn{fill:var(--warn1)}.s-warn{stroke:var(--warn2)}.x-warn{fill:var(--warn2)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--line)" stroke-width=".7"/></pattern></defs><rect x="1" y="1" width="513" height="281" rx="7" class="bg"/><rect x="1" y="1" width="513" height="281" rx="7" class="grid"/><text x="28" y="48" class="h">Can I deploy? (blueprint)</text><path d="M220 135.5 C256.4 135.5 256.4 102.5 292.9 102.5" class="e" marker-end="url(#ah)"/><path d="M220 135.5 C256.4 135.5 256.4 179 292.9 179" class="e" marker-end="url(#ah)"/><path d="M391.9 203 C391.9 229 123 229 123 161.5" class="e" marker-end="url(#ah)"/><rect x="28" y="115.5" width="190" height="40" rx="3" class="card c-warn"/><rect x="296.9" y="72" width="190" height="61" rx="3" class="card c-ok"/><rect x="296.9" y="159" width="190" height="40" rx="3" class="card c-bad"/><text x="271.4" y="94.5" class="el" text-anchor="middle">yes</text><text x="275.2" y="197" class="el" text-anchor="middle">no</text><text x="257.4" y="234.3" class="el" text-anchor="middle">try again</text><text x="123" y="140.5" class="t" text-anchor="middle">Tests pass?</text><text x="391.9" y="97" class="t" text-anchor="middle">Deploy</text><text x="391.9" y="118" class="n" text-anchor="middle">it ships</text><text x="391.9" y="184" class="t" text-anchor="middle">Fix first</text></svg>
