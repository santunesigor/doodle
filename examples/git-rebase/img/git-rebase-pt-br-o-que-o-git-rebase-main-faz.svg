<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 247" width="1160" height="247" role="img" aria-label="O que o git rebase main faz"><title>O que o git rebase main faz</title><style>svg{--bg:#fffdf9;--line:#ebe5da;--ink:#1f2933;--mut:#5f6b7a;--edge:#7b8794;--neutral1:#f4f1ea;--neutral2:#8a8174;--info1:#e8f1fc;--info2:#3a78c2;--ok1:#e7f6eb;--ok2:#2f8a4b;--bad1:#fdecea;--bad2:#c8423b;--warn1:#fff5df;--warn2:#c38410}@media (prefers-color-scheme:dark){svg{--bg:#14181d;--line:#2a3038;--ink:#e6e9ed;--mut:#a2acb8;--edge:#8d98a5;--neutral1:#23272e;--neutral2:#8b949e;--info1:#132a43;--info2:#6aa8ec;--ok1:#12301d;--ok2:#5cc184;--bad1:#3b1716;--bad2:#f07c74;--warn1:#3a2c0c;--warn2:#f0b543}}text{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg);stroke:var(--line)}.h{font-size:20px;font-weight:700}.sub{font-size:13px;fill:var(--mut)}.t{font-size:15px;font-weight:650}.n{font-size:13px;fill:var(--mut)}.card{stroke-width:1.6}.w{fill:#fff;font-size:12px;font-weight:700}.e{fill:none;stroke:var(--edge);stroke-width:1.8;stroke-linecap:round}.d{stroke-dasharray:6 5}.ah{fill:var(--edge)}.ln{stroke:var(--line);stroke-width:2;fill:none}.el{font-size:12.5px;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.big{font-size:64px;fill:var(--line)}.c-neutral{fill:var(--neutral1);stroke:var(--neutral2)}.f-neutral{fill:var(--neutral2)}.s-neutral{stroke:var(--neutral2)}.x-neutral{fill:var(--neutral2)}.c-info{fill:var(--info1);stroke:var(--info2)}.f-info{fill:var(--info2)}.s-info{stroke:var(--info2)}.x-info{fill:var(--info2)}.c-ok{fill:var(--ok1);stroke:var(--ok2)}.f-ok{fill:var(--ok2)}.s-ok{stroke:var(--ok2)}.x-ok{fill:var(--ok2)}.c-bad{fill:var(--bad1);stroke:var(--bad2)}.f-bad{fill:var(--bad2)}.s-bad{stroke:var(--bad2)}.x-bad{fill:var(--bad2)}.c-warn{fill:var(--warn1);stroke:var(--warn2)}.f-warn{fill:var(--warn2)}.s-warn{stroke:var(--warn2)}.x-warn{fill:var(--warn2)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity=".10"/></filter></defs><rect x="1" y="1" width="1158" height="245" rx="16" class="bg"/><text x="28" y="48" class="h">O que o git rebase main faz</text><path d="M28 90 H1130" class="e" marker-end="url(#ah)"/><path d="M128 90 V120" class="ln"/><rect x="28" y="120" width="200" height="79" rx="12" class="card c-info" filter="url(#sh)"/><circle cx="128" cy="90" r="11" class="f-info"/><path d="M350 90 V120" class="ln"/><rect x="250" y="120" width="200" height="99" rx="12" class="card c-neutral" filter="url(#sh)"/><circle cx="350" cy="90" r="11" class="f-neutral"/><path d="M572 90 V120" class="ln"/><rect x="472" y="120" width="200" height="81" rx="12" class="card c-neutral" filter="url(#sh)"/><circle cx="572" cy="90" r="11" class="f-neutral"/><path d="M794 90 V120" class="ln"/><rect x="694" y="120" width="200" height="79" rx="12" class="card c-warn" filter="url(#sh)"/><circle cx="794" cy="90" r="11" class="f-warn"/><path d="M1016 90 V120" class="ln"/><rect x="916" y="120" width="200" height="61" rx="12" class="card c-ok" filter="url(#sh)"/><circle cx="1016" cy="90" r="11" class="f-ok"/><text x="42" y="145" class="t">Acha o ponto de partida</text><text x="42" y="166" class="n">onde a sua branch saiu da</text><text x="42" y="184" class="n">main</text><text x="128" y="94" class="w" text-anchor="middle">1</text><text x="264" y="145" class="t">Guarda os seus</text><text x="264" y="165" class="t">commits</text><text x="264" y="186" class="n">A e B viram &quot;receitas&quot; de</text><text x="264" y="204" class="n">mudança</text><text x="350" y="94" class="w" text-anchor="middle">2</text><text x="486" y="145" class="t">Pula para a ponta da</text><text x="486" y="165" class="t">main</text><text x="486" y="186" class="n">pega o que o time já juntou</text><text x="572" y="94" class="w" text-anchor="middle">3</text><text x="708" y="145" class="t">Refaz A e B</text><text x="708" y="166" class="n">viram A' e B', com hashes</text><text x="708" y="184" class="n">novos</text><text x="794" y="94" class="w" text-anchor="middle">4</text><text x="930" y="145" class="t">Pronto</text><text x="930" y="166" class="n">história em linha reta</text><text x="1016" y="94" class="w" text-anchor="middle">5</text></svg>
