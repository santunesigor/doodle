<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="740" height="260" role="img" aria-label="Merge ou rebase?"><title>Merge ou rebase?</title><desc>Merge - junta as duas linhas; Pode criar commit de merge; Não muda nenhum hash; Seguro em branch compartilhada; Rebase - refaz a sua linha em cima da outra; História em linha reta; Muda os hashes dos seus commits; Perigoso em branch compartilhada</desc><style>svg{--bg:#fffdf9;--line:#ebe5da;--ink:#1f2933;--mut:#5f6b7a;--edge:#7b8794;--on:#ffffff;--neutral1:#f4f1ea;--neutral2:#8a8174;--info1:#e8f1fc;--info2:#3a78c2;--ok1:#e7f6eb;--ok2:#2f8a4b;--bad1:#fdecea;--bad2:#c8423b;--warn1:#fff5df;--warn2:#c38410}@media (prefers-color-scheme:dark){svg{--bg:#14181d;--line:#2a3038;--ink:#e6e9ed;--mut:#a2acb8;--edge:#8d98a5;--on:#14181d;--neutral1:#23272e;--neutral2:#8b949e;--info1:#132a43;--info2:#6aa8ec;--ok1:#12301d;--ok2:#5cc184;--bad1:#3b1716;--bad2:#f07c74;--warn1:#3a2c0c;--warn2:#f0b543}}text{font-family:ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg);stroke:var(--line)}.grid{fill:url(#grid)}.h{font-size:20px;font-weight:700}.sub{font-size:13px;fill:var(--mut)}.t{font-size:15px;font-weight:650}.n{font-size:13px;fill:var(--mut)}.card{stroke-width:1.6}.w{fill:var(--on);font-size:12px;font-weight:700}.sk{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.sk2{stroke-width:.9;opacity:.6}.e{fill:none;stroke:var(--edge);stroke-width:1.8;stroke-linecap:round}.d{stroke-dasharray:6 5}.ah{fill:var(--edge)}.ln{stroke:var(--line);stroke-width:2;fill:none}.el{font-size:12.5px;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.big{font-size:64px;fill:var(--line)}.c-neutral{fill:var(--neutral1);stroke:var(--neutral2)}.f-neutral{fill:var(--neutral2)}.k-neutral{fill:var(--neutral1)}.s-neutral{stroke:var(--neutral2)}.x-neutral{fill:var(--neutral2)}.c-info{fill:var(--info1);stroke:var(--info2)}.f-info{fill:var(--info2)}.k-info{fill:var(--info1)}.s-info{stroke:var(--info2)}.x-info{fill:var(--info2)}.c-ok{fill:var(--ok1);stroke:var(--ok2)}.f-ok{fill:var(--ok2)}.k-ok{fill:var(--ok1)}.s-ok{stroke:var(--ok2)}.x-ok{fill:var(--ok2)}.c-bad{fill:var(--bad1);stroke:var(--bad2)}.f-bad{fill:var(--bad2)}.k-bad{fill:var(--bad1)}.s-bad{stroke:var(--bad2)}.x-bad{fill:var(--bad2)}.c-warn{fill:var(--warn1);stroke:var(--warn2)}.f-warn{fill:var(--warn2)}.k-warn{fill:var(--warn1)}.s-warn{stroke:var(--warn2)}.x-warn{fill:var(--warn2)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity=".10"/></filter></defs><rect x="1" y="1" width="738" height="258" rx="16" class="bg"/><text x="28" y="48" class="h">Merge ou rebase?</text><rect x="28" y="72" width="330" height="160" rx="14" class="card c-info" filter="url(#sh)"/><path d="M42 129 H344" class="ln s-info" style="opacity:.35"/><circle cx="51" cy="149" r="9" class="f-warn"/><circle cx="51" cy="178" r="9" class="f-ok"/><circle cx="51" cy="207" r="9" class="f-ok"/><rect x="382" y="72" width="330" height="160" rx="14" class="card c-info" filter="url(#sh)"/><path d="M396 129 H698" class="ln s-info" style="opacity:.35"/><circle cx="405" cy="149" r="9" class="f-ok"/><circle cx="405" cy="178" r="9" class="f-warn"/><circle cx="405" cy="207" r="9" class="f-bad"/><text x="42" y="102" class="t x-info" style="font-size:16px">Merge</text><text x="42" y="121" class="n">junta as duas linhas</text><text x="51" y="153" class="w" text-anchor="middle">!</text><text x="68" y="154" class="t" style="font-size:14px">Pode criar commit de merge</text><text x="51" y="182" class="w" text-anchor="middle">✓</text><text x="68" y="183" class="t" style="font-size:14px">Não muda nenhum hash</text><text x="51" y="211" class="w" text-anchor="middle">✓</text><text x="68" y="212" class="t" style="font-size:14px">Seguro em branch compartilhada</text><text x="396" y="102" class="t x-info" style="font-size:16px">Rebase</text><text x="396" y="121" class="n">refaz a sua linha em cima da outra</text><text x="405" y="153" class="w" text-anchor="middle">✓</text><text x="422" y="154" class="t" style="font-size:14px">História em linha reta</text><text x="405" y="182" class="w" text-anchor="middle">!</text><text x="422" y="183" class="t" style="font-size:14px">Muda os hashes dos seus commits</text><text x="405" y="211" class="w" text-anchor="middle">✗</text><text x="422" y="212" class="t" style="font-size:14px">Perigoso em branch compartilhada</text></svg>
