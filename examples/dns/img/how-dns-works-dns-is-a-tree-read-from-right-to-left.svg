<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 427 363" width="427" height="363" role="img" aria-label="DNS is a tree, read from right to left"><title>DNS is a tree, read from right to left</title><desc>. (root) - the top of the tree; com - a top-level domain (TLD); example.com - holds the real answer; www.example.com - 203.0.113.10; org - another TLD; br - another TLD</desc><style>svg{--bg:#fffdf9;--line:#ebe5da;--ink:#1f2933;--mut:#5f6b7a;--edge:#7b8794;--on:#ffffff;--neutral1:#f4f1ea;--neutral2:#8a8174;--info1:#e8f1fc;--info2:#3a78c2;--ok1:#e7f6eb;--ok2:#2f8a4b;--bad1:#fdecea;--bad2:#c8423b;--warn1:#fff5df;--warn2:#c38410}@media (prefers-color-scheme:dark){svg{--bg:#14181d;--line:#2a3038;--ink:#e6e9ed;--mut:#a2acb8;--edge:#8d98a5;--on:#14181d;--neutral1:#23272e;--neutral2:#8b949e;--info1:#132a43;--info2:#6aa8ec;--ok1:#12301d;--ok2:#5cc184;--bad1:#3b1716;--bad2:#f07c74;--warn1:#3a2c0c;--warn2:#f0b543}}text{font-family:ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg);stroke:var(--line)}.grid{fill:url(#grid)}.h{font-size:20px;font-weight:700}.sub{font-size:13px;fill:var(--mut)}.t{font-size:15px;font-weight:650}.n{font-size:13px;fill:var(--mut)}.card{stroke-width:1.6}.w{fill:var(--on);font-size:12px;font-weight:700}.sk{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.sk2{stroke-width:.9;opacity:.6}.e{fill:none;stroke:var(--edge);stroke-width:1.8;stroke-linecap:round}.d{stroke-dasharray:6 5}.ah{fill:var(--edge)}.ln{stroke:var(--line);stroke-width:2;fill:none}.el{font-size:12.5px;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.big{font-size:64px;fill:var(--line)}.c-neutral{fill:var(--neutral1);stroke:var(--neutral2)}.f-neutral{fill:var(--neutral2)}.k-neutral{fill:var(--neutral1)}.s-neutral{stroke:var(--neutral2)}.x-neutral{fill:var(--neutral2)}.c-info{fill:var(--info1);stroke:var(--info2)}.f-info{fill