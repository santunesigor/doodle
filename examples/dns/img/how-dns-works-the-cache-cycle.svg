<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 643 381" width="643" height="381" role="img" aria-label="The cache cycle"><title>The cache cycle</title><style>svg{--bg:#fffdf9;--line:#ebe5da;--ink:#1f2933;--mut:#5f6b7a;--edge:#7b8794;--neutral1:#f4f1ea;--neutral2:#8a8174;--info1:#e8f1fc;--info2:#3a78c2;--ok1:#e7f6eb;--ok2:#2f8a4b;--bad1:#fdecea;--bad2:#c8423b;--warn1:#fff5df;--warn2:#c38410}@media (prefers-color-scheme:dark){svg{--bg:#14181d;--line:#2a3038;--ink:#e6e9ed;--mut:#a2acb8;--edge:#8d98a5;--neutral1:#23272e;--neutral2:#8b949e;--info1:#132a43;--info2:#6aa8ec;--ok1:#12301d;--ok2:#5cc184;--bad1:#3b1716;--bad2:#f07c74;--warn1:#3a2c0c;--warn2:#f0b543}}text{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg);stroke:var(--line)}.h{font-size:20px;font-weight:700}.sub{font-size:13px;fill:var(--mut)}.t{font-size:15px;font-weight:650}.n{font-size:13px;fill:var(--mut)}.card{stroke-width:1.6}.w{fill:#fff;font-size:12px;font-weight:700}.e{fill:none;stroke:var(--edge);stroke-width:1.8;stroke-linecap:round}.d{stroke-dasharray:6 5}.ah{fill:var(--edge)}.ln{stroke:var(--line);stroke-width:2;fill:none}.el{font-size:12.5px;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.big{font-size:64px;fill:var(--line)}.c-neutral{fill:var(--neutral1);stroke:var(--neutral2)}.f-neutral{fill:var(--neutral2)}.s-neutral{stroke:var(--neutral2)}.x-neutral{fill:var(--neutral2)}.c-info{fill:var(--info1);stroke:var(--info2)}.f-info{fill:var(--info2)}.s-info{stroke:var(--info2)}.x-info{fill:var(--info2)}.c-ok{fill:var(--ok1);stroke:var(--ok2)}.f-ok{fill:var(--ok2)}.s-ok{stroke:var(--ok2)}.x-ok{fill:var(--ok2)}.c-bad{fill:var(--bad1);stroke:var(--bad2)}.f-bad{fill:var(--bad2)}.s-bad{stroke:var(--bad2)}.x-bad{fill:var(--bad2)}.c-warn{fill:var(--warn1);stroke:var(--warn2)}.f-warn{fill:var(--warn2)}.s-warn{stroke:var(--warn2)}.x-warn{fill:var(--warn2)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity=".10"/></filter></defs><rect x="1" y="1" width="641" height="379" rx="16" class="bg"/><text x="28" y="48" class="h">The cache cycle</text><path d="M383.5 139 Q437.6 144.4 446.8 176" class="e" marker-end="url(#ah)"/><path d="M446.8 249 Q437.6 280.6 383.5 286" class="e" marker-end="url(#ah)"/><path d="M258.7 286 Q204.6 280.6 195.4 249" class="e" marker-end="url(#ah)"/><path d="M195.4 176 Q204.6 144.4 258.7 139" class="e" marker-end="url(#ah)"/><rect x="216.1" y="72" width="210" height="61" rx="12" class="card c-info" filter="url(#sh)"/><rect x="404.2" y="182" width="210" height="61" rx="12" class="card c-ok" filter="url(#sh)"/><rect x="216.1" y="292" width="210" height="61" rx="12" class="card c-ok" filter="url(#sh)"/><rect x="28" y="182" width="210" height="61" rx="12" class="card c-warn" filter="url(#sh)"/><text x="321.1" y="234.5" class="big" text-anchor="middle">↻</text><text x="321.1" y="97" class="t" text-anchor="middle">Full lookup</text><text x="321.1" y="118" class="n" text-anchor="middle">walks the tree (slow)</text><text x="509.2" y="207" class="t" text-anchor="middle">Answer cached</text><text x="509.2" y="228" class="n" text-anchor="middle">kept for TTL seconds</text><text x="321.1" y="317" class="t" text-anchor="middle">Instant answers</text><text x="321.1" y="338" class="n" text-anchor="middle">everyone near reuses it</text><text x="133" y="207" class="t" text-anchor="middle">TTL expires</text><text x="133" y="228" class="n" text-anchor="middle">the answer is thrown away</text></svg>
