<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 422" width="656" height="422" role="img" aria-label="Who answers, from closest to farthest"><title>Who answers, from closest to farthest</title><desc>Browser cache - already asked a moment ago?; Operating system cache - shared by every app; Home router - many routers keep a small cache; Resolver - has a big shared cache, walks the tree only if needed</desc><style>svg{--bg:#fffdf9;--line:#ebe5da;--ink:#1f2933;--mut:#5f6b7a;--edge:#7b8794;--on:#ffffff;--neutral1:#f4f1ea;--neutral2:#8a8174;--info1:#e8f1fc;--info2:#3a78c2;--ok1:#e7f6eb;--ok2:#2f8a4b;--bad1:#fdecea;--bad2:#c8423b;--warn1:#fff5df;--warn2:#c38410}@media (prefers-color-scheme:dark){svg{--bg:#14181d;--line:#2a3038;--ink:#e6e9ed;--mut:#a2acb8;--edge:#8d98a5;--on:#14181d;--neutral1:#23272e;--neutral2:#8b949e;--info1:#132a43;--info2:#6aa8ec;--ok1:#12301d;--ok2:#5cc184;--bad1:#3b1716;--bad2:#f07c74;--warn1:#3a2c0c;--warn2:#f0b543}}text{font-family:ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg);stroke:var(--line)}.grid{fill:url(#grid)}.h{font-size:20px;font-weight:700}.sub{font-size:13px;fill:var(--mut)}.t{font-size:15px;font-weight:650}.n{font-size:13px;fill:var(--mut)}.card{stroke-width:1.6}.w{fill:var(--on);font-size:12px;font-weight:700}.sk{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.sk2{stroke-width:.9;opacity:.6}.e{fill:none;stroke:var(--edge);stroke-width:1.8;stroke-linecap:round}.d{stroke-dasharray:6 5}.ah{fill:var(--edge)}.ln{stroke:var(--line);stroke-width:2;fill:none}.el{font-size:12.5px;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.big{font-size:64px;fill:var(--line)}.c-neutral{fill:var(--neutral1);stroke:var(--neutral2)}.f-neutral{fill:var(--neutral2)}.k-neutral{fill:var(--neutral1)}.s-neutral{stroke:var(--neutral2)}.x-neutral{fill:var(--neutral2)}.c-info{fill:var(--info1);stroke:var(--info2)}.f-info{fill:var(--info2)}.k-info{fill:var(--info1)}.s-info{stroke:var(--info2)}.x-info{fill:var(--info2)}.c-ok{fill:var(--ok1);stroke:var(--ok2)}.f-ok{fill:var(--ok2)}.k-ok{fill:var(--ok1)}.s-ok{stroke:var(--ok2)}.x-ok{fill:var(--ok2)}.c-bad{fill:var(--bad1);stroke:var(--bad2)}.f-bad{fill:var(--bad2)}.k-bad{fill:var(--bad1)}.s-bad{stroke:var(--bad2)}.x-bad{fill:var(--bad2)}.c-warn{fill:var(--warn1);stroke:var(--warn2)}.f-warn{fill:var(--warn2)}.k-warn{fill:var(--warn1)}.s-warn{stroke:var(--warn2)}.x-warn{fill:var(--warn2)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity=".10"/></filter></defs><rect x="1" y="1" width="654" height="420" rx="16" class="bg"/><text x="28" y="48" class="h">Who answers, from closest to farthest</text><rect x="28" y="72" width="600" height="61" rx="12" class="card c-ok" filter="url(#sh)"/><rect x="28" y="159" width="600" height="61" rx="12" class="card c-ok" filter="url(#sh)"/><rect x="28" y="246" width="600" height="61" rx="12" class="card c-neutral" filter="url(#sh)"/><rect x="28" y="333" width="600" height="61" rx="12" class="card c-info" filter="url(#sh)"/><path d="M328 136 V156" class="e" marker-end="url(#ah)"/><path d="M328 223 V243" class="e" marker-end="url(#ah)"/><path d="M328 310 V330" class="e" marker-end="url(#ah)"/><text x="42" y="97" class="t">Browser cache</text><text x="42" y="118" class="n">already asked a moment ago?</text><text x="42" y="184" class="t">Operating system cache</text><text x="42" y="205" class="n">shared by every app</text><text x="42" y="271" class="t">Home router</text><text x="42" y="292" class="n">many routers keep a small cache</text><text x="42" y="358" class="t">Resolver</text><text x="42" y="379" class="n">has a big shared cache, walks the tree only if needed</text></svg>
